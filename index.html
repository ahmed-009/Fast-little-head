<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b4acb"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>الحساب الذهني</title>
<style>
:root{--bg:#eef1f6;--c:#fff;--t:#14172a;--s:#5d6479;--b:#dde2ee;--p:#2b4acb;--bt:#fff;--r:#c2410c;--a:#b45309;--g:#157f5a}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--c:#181c28;--t:#eef0f8;--s:#9aa3bb;--b:#2a3042;--p:#8aa4ff;--bt:#0b1030;--r:#fb923c;--a:#fbbf24;--g:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:520px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:0 0 6px}p{margin:6px 0}
.cd{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
.s{color:var(--s);font-size:14px}
.bt{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:var(--bt);font:inherit;font-weight:600;margin:10px 0 0}
.bt.o{background:none;color:var(--p);border:1px solid var(--p)}
.m{font-size:36px;text-align:center;padding:14px 0;font-weight:600;font-variant-numeric:tabular-nums}
.an{min-height:76px;font-size:30px;text-align:center;direction:ltr;border-top:1px dashed var(--b);padding-top:8px}
.sl{font-size:15px;color:var(--s);margin:4px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.kp button{padding:16px 0;font-size:24px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t)}
.pg{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:4px 0 12px}.pg i{display:block;height:100%;background:var(--p)}
.pg i.r{background:var(--r)}.pg i.a{background:var(--a)}.pg i.g{background:var(--g)}
.rw{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.r,.no{color:var(--r)}.a{color:var(--a)}.g,.ok{color:var(--g)}
.st{padding:8px 12px;margin:6px 0;background:var(--bg);border-radius:8px;opacity:0;animation:f .4s forwards;animation-delay:var(--d)}@keyframes f{to{opacity:1}}
.li{display:flex;justify-content:space-between;width:100%;padding:12px 0;background:none;border:0;border-top:1px solid var(--b);color:var(--t);font:inherit;text-align:start}.li:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--s);font:inherit;font-size:13px}nav button.on{color:var(--p);font-weight:700}
</style></head><body><main id="v"></main><nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],th=n=>n-n%10;
let S;try{S=JSON.parse(localStorage.getItem('mm'))}catch(e){}
S=S||{done:{},tested:{},sk:{},needs:{},T:{},base:{},log:{}};
const save=()=>{try{localStorage.setItem('mm',JSON.stringify(S))}catch(e){}},td=()=>new Date().toISOString().slice(0,10);
const G={
tab:l=>{const a=R(2,l>1?12:9),b=R(2,l>1?12:9);return{q:`${a} × ${b}`,a:a*b,tg:[a>5&&b>5?'أرقام كبيرة':'سهل'],h:`${a} × ${b} = ${a*b}`}},
comp:l=>{const n=l>1?R(1,99):5*R(1,19);return{q:`100 − ${n}`,a:100-n,tg:[n%10>5?'آحاد كبيرة':'عادي'],h:`كمّل الآحاد لـ10 والعشرات لـ9 = ${100-n}`}},
sq:l=>{const n=R(2,l>1?25:15);return{q:`${n}²`,a:n*n,tg:[n>15?'فوق 15':'لحد 15'],h:`${n} × ${n} = ${n*n}`}},
dbl:l=>{if(Math.random()<.5){const n=R(12,l>1?499:99);return{q:`ضعف ${n}`,a:2*n,tg:['ضعف'],h:`ضعّف كل خانة من الشمال = ${2*n}`}}const n=2*R(6,l>1?250:50);return{q:`نصف ${n}`,a:n/2,tg:['نصف'],h:`نصّف كل خانة من الشمال = ${n/2}`}},
divr:l=>{const d=P([2,3,5,9,10,11]),n=Math.random()<.5?d*R(12,99):R(100,999),y=n%d==0,r={2:'آخر رقم زوجي',5:'آخر رقم 0 أو 5',10:'آخر رقم 0',3:'مجموع الأرقام يقبل 3',9:'مجموع الأرقام يقبل 9',11:'الفرق بين مجموع الأرقام الفردية والزوجية يقبل 11'}[d];return{q:`هل ${n} تقبل القسمة على ${d}؟ (1 نعم / 0 لا)`,a:y?1:0,tg:['على '+d],h:`${r} ← ${y?'نعم (1)':'لا (0)'}`}},
add2:l=>{const a=R(12,l>1?98:60),b=R(12,98);return{q:`${a} + ${b}`,a:a+b,tg:[a%10+b%10>9?'ترحيل':'بدون ترحيل'],h:`${a} + ${th(b)} = ${a+th(b)} ثم + ${b%10} = ${a+b}`}},
add3:l=>{if(l<2){const a=R(101,899),b=R(11,99);return{q:`${a} + ${b}`,a:a+b,tg:['3 + 2 خانات'],h:`${a} + ${th(b)} = ${a+th(b)} ثم + ${b%10} = ${a+b}`}}const x=R(11,99),y=R(11,99),z=R(11,99);return{q:`${x} + ${y} + ${z}`,a:x+y+z,tg:['سلسلة'],h:`${x} + ${y} = ${x+y} ثم + ${z} = ${x+y+z}`}},
adj:l=>{const b=P([48,49,51,52,38,98,99,198,199,299]),a=R(21,400),r=b<100?Math.round(b/10)*10:Math.round(b/100)*100;return{q:`${a} + ${b}`,a:a+b,tg:['قريب من '+r],h:`${a} + ${r} = ${a+r} ثم ${b>r?'+':'−'} ${Math.abs(b-r)} = ${a+b}`}},
sub2:l=>{let a,b;if(l<2){a=R(30,99);b=R(11,a-5)}else{a=R(100,999);b=R(11,99)}return{q:`${a} − ${b}`,a:a-b,tg:[b%10>a%10?'استلاف':'عادي'],h:`${a} − ${th(b)} = ${a-th(b)} ثم − ${b%10} = ${a-b}`}},
subc:l=>{const k=R(3,9)*100,d=R(3,19),b=k-d,a=R(k+20,k+600);return{q:`${a} − ${b}`,a:a-b,tg:['قريب من '+k],h:`${a} − ${k} = ${a-k} ثم + ${d} = ${a-b}`}},
dv:l=>{const d=R(2,9),n=d*R(12,110);return{q:`${n} ÷ ${d}`,a:n/d,tg:['قسمة'],h:`قسّم من الشمال = ${n/d}`}}};
const K={tab:['جدول الضرب',1,2],comp:['المكمّلات',1,3],sq:['المربعات',1,3],dbl:['التضعيف والتنصيف',1,3],divr:['قواعد القسمة',1,5],add2:['جمع رقمين',2,3],add3:['جمع 3 أرقام وسلاسل',2,5],adj:['التعويض: قرّب وعدّل',2,4],sub2:['الطرح من الشمال',2,5],subc:['الطرح بالتحويل لجمع',2,6],dv:['القسمة',0,5]};
const BM={tab:'tab',sq:'tab',dbl:'tab',comp:'add2',divr:'dv',add2:'add2',add3:'add2',adj:'add2',sub2:'sub2',subc:'sub2'};
const STG=['الانطلاق','الأساسيات','الجمع والطرح من الشمال'];
const L=[
{id:'intro',s:0,t:'إزاي التطبيق بيشتغل',c:[['e','الفكرة','الحساب الذهني سرعة مبنية على طرق صح وحقائق محفوظة. هنحسب من الشمال لليمين لأننا بنقرأ وننطق الأرقام كده، وده بيخلّي الحساب في الدماغ أسهل.'],['e','إزاي بنتعلم','كل درس كروت: شرح ثم مثال ثم أسئلة. بعد كل مرحلة اختبار بسكور لكل تقنية، والتقنية الضعيفة بتروح قسم الاحتياجات لحد ما تنجح في امتحانها. حل كل مسألة من دماغك بدون ورقة.']]},
{id:'tab',c:[['e','ليه الجدول؟','لازم تعرف أي ضرب من 2×2 لـ12×12 فورًا، لأن كل الطرق اللي جاية بتعتمد عليه. أي تردد هنا بيبطّئ كل حاجة بعده.'],['e','إزاي تثبّته','جاوب من دماغك قبل ما تشوف الحل. ركّز على الصعب: 6×7 و6×8 و6×9 و7×8 و7×9 و8×9. وفي ×9: اضرب في 10 وانقص الرقم.'],['x','مثال: 7 × 9','7 × 9 = 70 − 7|= 63']]},
{id:'comp',c:[['e','المكمّل','المكمّل لـ100 هو اللي بيكمّل الرقم لحد 100. كمّل الآحاد لـ10 والعشرات لـ9، فتطلع الإجابة من غير طرح.'],['x','مثال: 100 − 37','الآحاد: 7 تكمّلها 3 لـ10|العشرات: 3 تكمّلها 6 لـ9|الناتج 63'],['e','فايدته','هتحتاجه في تحويل الطرح لجمع وفي النسب.']]},
{id:'sq',c:[['e','احفظها','احفظ مربعات 1 لـ25: 13²=169، 14²=196، 15²=225، 16²=256، 17²=289، 18²=324، 19²=361، 21²=441، 22²=484، 23²=529، 24²=576، 25²=625. هتستخدمها في فرق المربعات والتربيع بعدين.'],['x','مثال: 17²','17 × 17 = 17 × 10 + 17 × 7|170 + 119|= 289']]},
{id:'dbl',c:[['e','التضعيف والتنصيف','ضعّف أو نصّف كل خانة من الشمال لوحدها. وفي التنصيف لو الخانة فردية ارحّل 5 للخانة اللي بعدها.'],['x','مثال: ضعف 47','40 × 2 = 80|7 × 2 = 14|80 + 14 = 94'],['x','مثال: نصف 86','نصف 80 = 40|نصف 6 = 3|الناتج 43']]},
{id:'divr',c:[['e','القواعد','2: آخر رقم زوجي. 5: آخر رقم 0 أو 5. 10: آخر رقم 0. 3 و9: مجموع الأرقام يقبل 3 أو 9. 11: الفرق بين مجموع الأرقام الفردية الترتيب والزوجية يقبل 11 (أو صفر).'],['x','مثال: هل 738 تقبل 9؟','7 + 3 + 8 = 18|18 تقبل 9|يبقى 738 تقبل القسمة على 9']]},
{id:'add2',c:[['e','من الشمال','ابدأ بالعشرات: ضيف عشرات الرقم التاني للأول، وبعدين الآحاد. كده بتنطق الناتج بالترتيب الطبيعي وما بتحتفظش بأرقام كتير في دماغك.'],['x','مثال: 47 + 38','47 + 30 = 77|77 + 8 = 85'],['e','ملاحظة','قول الخطوات بصوت واطي وإنت بتتدرب، ده بيسرّع التعلم.']]},
{id:'add3',c:[['e','أرقام أكتر','مع 3 أرقام أو سلسلة جمع، اجمع واحد واحد بنفس الطريقة وانطق الناتج الجزئي كل مرة بدل ما تحفظ الأرقام كلها.'],['x','مثال: 623 + 59','623 + 50 = 673|673 + 9 = 682'],['x','مثال: 47 + 38 + 26','47 + 38 = 85|85 + 26 = 111']]},
{id:'adj',c:[['e','قرّب وعدّل','لو الرقم قريب من رقم مدوّر (49 أو 98 أو 199) اجمع المدوّر وبعدين عدّل الفرق. أسهل بكتير من الجمع الأصلي.'],['x','مثال: 76 + 49','76 + 50 = 126|126 − 1 = 125'],['x','مثال: 138 + 198','138 + 200 = 338|338 − 2 = 336']]},
{id:'sub2',c:[['e','الطرح من الشمال','اطرح العشرات الأول وبعدين الآحاد على التوالي، من غير استلاف على الورق.'],['x','مثال: 832 − 47','832 − 40 = 792|792 − 7 = 785']]},
{id:'subc',c:[['e','الطرح بتحويله','لو الرقم اللي بتطرحه قريب من رقم مدوّر (587 قريب من 600) اطرح المدوّر وبعدين رجّع الفرق. ده بيحوّل الطرح الصعب لخطوتين سهلات.'],['x','مثال: 1241 − 587','1241 − 600 = 641|600 − 587 = 13|641 + 13 = 654']]}];
L.forEach(l=>{if(K[l.id]){l.t=K[l.id][0];l.s=K[l.id][1];l.sk=l.id}});
const seq=[];STG.forEach((n,s)=>{L.filter(l=>l.s==s).forEach(l=>seq.push({k:'l',id:l.id,s,t:l.t}));seq.push({k:'t',s,t:s?'اختبار: '+n:'اختبار البداية'})});
const dn=x=>x.k=='l'?S.done[x.id]:S.tested[x.s],av=i=>i==0||dn(seq[i-1]);
const T=s=>S.T[s]||(S.base[BM[s]]?Math.max(K[s][2],S.base[BM[s]]):K[s][2]*2);
function M(s){const h=(S.sk[s]||{}).h||[];if(!h.length)return null;const t=T(s);return Math.round(100*(.6*h.reduce((a,x)=>a+x[0],0)/h.length+.4*h.reduce((a,x)=>a+(x[0]?Math.min(1,t/x[1]):0),0)/h.length))}
const ST=m=>m==null?['—','s']:m<50?['ضعيف','r']:m<70?['متوسط','a']:m<85?['قوي','g']:['متقن','g'],LV=s=>{const m=M(s);return m==null||m<60?1:m<80?2:3};
const wt=k=>Object.entries((S.sk[k]||{}).tg||{}).filter(([g,x])=>x[1]>=3&&x[0]/x[1]>.3).sort((a,b)=>b[1][0]/b[1][1]-a[1][0]/a[1][1]).map(x=>x[0])[0];
function rec(s,ok,t,tg){const o=S.sk[s]=S.sk[s]||{h:[],tg:{}};o.h.push([ok?1:0,+t.toFixed(1)]);if(o.h.length>20)o.h.shift();(tg||[]).forEach(g=>{const x=o.tg[g]=o.tg[g]||[0,0];x[1]++;if(!ok)x[0]++});const d=td();S.log[d]=(S.log[d]||0)+Math.min(t,60)}
function chk(s){if(!S.done[s])return;const h=(S.sk[s]||{}).h||[];if(h.length<12)return;const l=h.slice(-12),acc=l.reduce((a,x)=>a+x[0],0)/12,ts=l.filter(x=>x[0]).map(x=>x[1]),av_=ts.length?ts.reduce((a,b)=>a+b)/ts.length:99;if(acc<.6||av_>2*T(s))S.needs[s]=1;save()}
const mk=(s,l)=>{const o=G[s](l);o.sk=s;return o};
function mkw(s){const w=wt(s);let q;for(let i=0;i<8;i++){q=mk(s,LV(s));if(!w||q.tg.includes(w))break}return q}
function pick(pool){const w=pool.map(s=>{const m=M(s);return 1+(m==null?1:(100-m)/20)+(S.needs[s]?1.5:0)});let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[0]}
const V=h=>{$('#v').innerHTML=h;scrollTo(0,0)};
function nav(t){const n=Object.keys(S.needs).length;$('#nv').innerHTML=[['h','الرئيسية'],['p','المسار'],['q','تدريب'],['k','مهاراتي'],...(n?[['n','احتياجات ('+n+')']]:[])].map(([k,x])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${x}</button>`).join('')}
function go(t){nav(t);({h:home,p:path,q:prac,k:skills,n:needs})[t]()}
const one=(s,r)=>{const k=r.filter(x=>x.ok).length,tm=(r.reduce((a,x)=>a+x.t,0)/r.length).toFixed(1),m=M(s),[n,c]=ST(m);return`<div class="rw"><span>${K[s][0]}</span><span>${k}/${r.length} · ${tm} ث · <b class="${c}">${n} ${m??''}</b></span></div>`},grp=r=>[...new Set(r.map(x=>x.s))].map(k=>one(k,r.filter(x=>x.s==k))).join('');
let Q,LN,NX,NX2;
function quiz(o){Q={o,i:0,res:[]};nq()}
function nq(){const o=Q.o;if(Q.i>=o.n){Q.dead=1;return o.end(Q.res)}let q;for(let k=0;k<3;k++){q=o.next();if(q.sk!=Q.last)break}Q.last=q.sk;Q.q=q;Q.u='';Q.lock=0;Q.t0=Date.now();
V(`${o.pg||''}<div class="cd"><div class="s">${o.hd||''}${isFinite(o.n)&&o.n>1?` · ${Q.i+1}/${o.n}`:''}</div><div class="m" dir="auto">${q.q}</div><div class="an" id="an">&nbsp;</div></div><div class="kp">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div>${isFinite(o.n)?'':'<button class="bt o" onclick="endQ()">إنهاء الجلسة</button>'}`)}
function key(k){if(Q.lock||Q.dead)return;if(k=='✓'){if(Q.u)sub();return}if(k=='⌫')Q.u=Q.u.slice(0,-1);else if(Q.u.length<8)Q.u+=k;$('#an').textContent=Q.u||'\u00a0'}
const nq0=()=>{if(!Q.dead)nq()},lat=()=>{const z=Q;setTimeout(()=>z==Q&&nq0(),650)},endQ=()=>{Q.dead=1;Q.o.end(Q.res)};
function sub(){const q=Q.q,o=Q.o,t=(Date.now()-Q.t0)/1000,ok=+Q.u==q.a,e=$('#an');Q.res.push({s:q.sk,ok,t,q:q.q,u:Q.u,a:q.a,h:q.h});for(let r=0;r<(o.w||1);r++)rec(q.sk,ok,t,q.tg);save();Q.i++;Q.lock=1;
if(ok){e.innerHTML=`<span class="ok">✓ ${t.toFixed(1)} ث</span>`;lat()}else if(o.fb=='sol')e.innerHTML=`<span class="no">✗</span><div class="sl" dir="auto">${q.h}</div><button class="bt" onclick="nq0()">التالي</button>`;else{e.innerHTML='<span class="no">✗</span>';lat()}}
function lesson(id,rem){const l=L.find(x=>x.id==id);LN={l,i:0,ex:0,rem,c:l.c.map(c=>({k:c[0],h:c[1],b:c[2]}))};if(l.sk){for(let i=0;i<(rem?5:3);i++)LN.c.push({k:'f'});LN.c.push({k:rem?'ex':'ch'})}lc()}
function lc(){const{l,c:cs,i}=LN,c=cs[i];
if(!c){S.done[l.id]=1;save();return V('<div class="cd"><h2>خلّصت الدرس ✓</h2></div><button class="bt" onclick="go(\'p\')">رجوع للمسار</button>')}
const pg=`<div class="pg"><i style="width:${100*i/cs.length}%"></i></div>`,nx=()=>mkw(l.sk);
if(c.k=='e'||c.k=='x')return V(`${pg}<div class="cd"><div class="s">${l.t} · ${i+1}/${cs.length}</div><h2>${c.h}</h2>${c.k=='e'?`<p>${c.b}</p>`:c.b.split('|').map((x,j)=>`<div class="st" dir="auto" style="--d:${j*.4}s">${x}</div>`).join('')}</div><button class="bt" onclick="LN.i++;lc()">التالي</button>${i&&['e','x'].includes(cs[i-1].k)?'<button class="bt o" onclick="LN.i--;lc()">السابق</button>':''}`);
if(c.k=='f')return quiz({n:1,fb:'sol',hd:l.t+' · سؤال',pg,next:nx,end:r=>{if(!r[0].ok&&LN.ex<3&&!LN.rem){LN.ex++;cs.splice(i+1,0,{k:'f'})}LN.i++;lc()}});
if(c.k=='ch')return quiz({n:5,fb:'quick',hd:'تحدّي الدرس',next:nx,end:r=>{const k=r.filter(x=>x.ok).length;if(k>=4){S.done[l.id]=1;save();V(`<div class="cd"><h2>خلّصت الدرس ✓</h2><p>${k} من 5 في التحدّي.</p></div><button class="bt" onclick="go('p')">رجوع للمسار</button>`)}else V(`<div class="cd"><h2>${k} من 5</h2><p>محتاج 4 على الأقل. راجع الشرح وحاول تاني.</p></div><button class="bt" onclick="LN.i=0;lc()">راجع الشرح</button><button class="bt o" onclick="lc()">أعد التحدّي</button>`)}});
quiz({n:10,fb:'quick',hd:'الامتحان المخصوص',next:nx,end:r=>{const k=r.filter(x=>x.ok),tm=k.length?k.reduce((a,x)=>a+x.t,0)/k.length:99;if(k.length>=8&&tm<=1.5*T(l.sk)){delete S.needs[l.sk];S.sk[l.sk].h=r.map(x=>[x.ok?1:0,+x.t.toFixed(1)]);save();V(`<div class="cd"><h2>نجحت ✓</h2><p>${k.length} من 10 بمتوسط ${tm.toFixed(1)} ث. الاحتياج اتشال.</p></div><button class="bt" onclick="go('h')">تمام</button>`)}else V(`<div class="cd"><h2>لسه</h2><p>${k.length} من 10 بمتوسط ${tm.toFixed(1)} ث. المطلوب 8 صح على الأقل بمتوسط أقل من ${(1.5*T(l.sk)).toFixed(1)} ث.</p></div><button class="bt" onclick="lc()">أعد الامتحان</button><button class="bt o" onclick="LN.i=0;lc()">راجع الدرس</button>`)}})}
function tst(s){const sks=s?Object.keys(K).filter(k=>K[k][1]==s):['add2','sub2','tab','dv'],n=s?6:5;let i=0,all=[];NX=()=>{if(i>=sks.length)return tfin(s,sks,all);const k=sks[i];V(`<div class="cd"><div class="s">كارت ${i+1}/${sks.length}</div><h2>${K[k][0]}</h2><p class="s">${n} أسئلة بتوقيت. جاوب من دماغك بدون ورقة.</p></div><button class="bt" onclick="NX2()">ابدأ</button>`);NX2=()=>quiz({n,w:s?2:1,hd:K[k][0],fb:'quick',next:()=>mk(k,LV(k)),end:r=>{all.push(...r);i++;V(`<div class="cd"><h2>${K[k][0]}</h2>${one(k,r)}</div><button class="bt" onclick="NX()">التالي</button>`)}})};NX()}
function tfin(s,sks,all){let h;if(!s){const b={};sks.forEach(k=>{const r=all.filter(x=>x.s==k);b[k]=+(r.reduce((a,x)=>a+x.t,0)/r.length).toFixed(1)});S.base=b;h='<h2>اختبار البداية</h2>'+sks.map(k=>`<div class="rw"><span>${K[k][0]}</span><span>${b[k]} ث للسؤال</span></div>`).join('')+'<p class="s">دي سرعتك الحالية. أهداف السرعة هتبدأ منها وتتشدّد بالتدريج.</p>'}else{let n=0;sks.forEach(k=>{const m=M(k);if(m>=70)S.T[k]=Math.max(K[k][2],T(k)*.85);if(m<50){S.needs[k]=1;n++}});h=`<h2>${STG[s]}</h2>`+sks.map(k=>one(k,all.filter(x=>x.s==k))).join('')+(n?`<p class="r">${n} تقنية اتضافت لقسم الاحتياجات.</p>`:'<p class="g">مفيش احتياجات جديدة.</p>')}S.tested[s]=1;save();V(`<div class="cd">${h}</div><button class="bt" onclick="go('p')">رجوع للمسار</button>`);nav('p')}
const stk=()=>{let n=0,d=new Date();for(let i=0;i<400;i++){const k=d.toISOString().slice(0,10);if(S.log[k]>0)n++;else if(n||k!=td())break;d.setDate(d.getDate()-1)}return n};
function home(){const x=seq.find(x=>!dn(x)),m=Math.round((S.log[td()]||0)/60),n=Object.keys(S.needs).length;V(`<h2>الحساب الذهني</h2><div class="cd"><div class="s">هدف اليوم · أيام متتالية: ${stk()}</div><h3>${m} / 20 دقيقة</h3><div class="pg"><i style="width:${Math.min(100,5*m)}%"></i></div></div>${n?`<div class="cd"><b class="r">عندك ${n} احتياج</b><button class="bt" onclick="go('n')">افتح الاحتياجات</button></div>`:''}${x?`<div class="cd"><div class="s">الخطوة الجاية</div><h3>${x.t}</h3><button class="bt" onclick="${x.k=='l'?`lesson('${x.id}')`:`tst(${x.s})`}">كمّل</button></div>`:'<div class="cd">خلّصت كل المحتوى المتاح. كمّل بالتدريب.</div>'}<button class="bt o" onclick="go('q')">تدريب</button>`)}
function path(){V('<h2>المسار</h2>'+STG.map((n,s)=>`<div class="cd"><h3>${s}. ${n}</h3>${seq.map((x,i)=>x.s==s?`<button class="li" ${av(i)?'':'disabled'} onclick="${x.k=='l'?`lesson('${x.id}')`:`tst(${s})`}"><span>${x.t}</span><span class="${dn(x)?'g':'s'}">${dn(x)?'تم':av(i)?'متاح':'مقفول'}</span></button>`:'').join('')}</div>`).join('')+'<p class="s">مراحل 3 إلى 6 جاية في الدفعات الجاية.</p>')}
const pool=()=>Object.keys(K).filter(k=>S.done[k]&&K[k][1]>0);
function prac(){const p=pool();V(p.length?`<h2>التدريب</h2><div class="cd"><p class="s">أسئلة لا نهائية من الدروس اللي خلّصتها بس، والأضعف بتيجي أكتر.</p><button class="bt" onclick="pr()">اخلط</button></div><div class="cd"><h3>تقنية محددة</h3>${p.map(s=>`<button class="bt o" onclick="pr('${s}')">${K[s][0]}</button>`).join('')}</div>`:'<h2>التدريب</h2><div class="cd">التدريب بيفتح بعد ما تخلّص أول درس تقنية، والأسئلة بتيجي من الدروس اللي خلّصتها بس.</div>')}
function pr(s){const p=pool();quiz({n:Infinity,fb:'sol',hd:s?K[s][0]:'تدريب مخلوط',next:()=>{const k=s||pick(p);return mk(k,LV(k))},end:r=>{if(!r.length)return go('q');[...new Set(r.map(x=>x.s))].forEach(chk);V(`<div class="cd"><h2>ملخص الجلسة</h2>${grp(r)}</div><button class="bt" onclick="go('q')">رجوع</button>`);nav('q')}})}
function skills(){V('<h2>مهاراتي</h2>'+[1,2].map(s=>`<div class="cd"><h3>${STG[s]}</h3>${Object.keys(K).filter(k=>K[k][1]==s).map(k=>{if(!S.done[k])return`<div class="rw s"><span>${K[k][0]}</span><span>مقفول</span></div>`;const h=(S.sk[k]||{}).h||[],m=M(k),[n,c]=ST(m),acc=h.length?Math.round(100*h.reduce((a,x)=>a+x[0],0)/h.length):0,w=wt(k);return`<div class="rw"><span>${K[k][0]}</span><b class="${c}">${n} ${m??''}</b></div><div class="pg"><i class="${c}" style="width:${m||0}%"></i></div><div class="s">دقة ${acc}% · الهدف ${T(k).toFixed(1)} ث${w?' · بتغلط في: '+w:''}</div>`}).join('')}</div>`).join(''))}
const nr=k=>{const l=((S.sk[k]||{}).h||[]).slice(-12),w=wt(k);return`غلطت ${l.filter(x=>!x[0]).length} من آخر ${l.length}${w?'، أغلبها في: '+w:''}`};
function needs(){const ks=Object.keys(S.needs).sort((a,b)=>(M(a)??0)-(M(b)??0));V('<h2>الاحتياجات</h2>'+(ks.length?ks.slice(0,3).map(k=>`<div class="cd"><h3>${K[k][0]}</h3><p class="s">${nr(k)}</p><button class="bt" onclick="lesson('${k}',1)">افتح الدرس وامتحنّي</button></div>`).join('')+(ks.length>3?`<p class="s">وفيه ${ks.length-3} في الطابور.</p>`:''):'<div class="cd">مفيش احتياجات دلوقتي.</div>'))}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('h');
</script></body></html>
