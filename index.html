<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b4acb"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>الحساب الذهني</title>
<style>
:root{--bg:#eef1f6;--c:#fff;--t:#14172a;--s:#5d6479;--b:#dde2ee;--p:#2b4acb;--bt:#fff;--r:#c2410c;--a:#b45309;--g:#157f5a}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--c:#181c28;--t:#eef0f8;--s:#9aa3bb;--b:#2a3042;--p:#8aa4ff;--bt:#0b1030;--r:#fb923c;--a:#fbbf24;--g:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:520px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:0 0 6px}p{margin:6px 0}
.cd{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}
.s{color:var(--s);font-size:14px}
.bt{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:var(--bt);font:inherit;font-weight:600;margin:10px 0 0}
.bt.o{background:none;color:var(--p);border:1px solid var(--p)}
.m{font-size:36px;text-align:center;padding:14px 0;font-weight:600;font-variant-numeric:tabular-nums}
.an{min-height:76px;font-size:30px;text-align:center;direction:ltr;border-top:1px dashed var(--b);padding-top:8px}
.sl{font-size:15px;color:var(--s);margin:4px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.kp button{padding:16px 0;font-size:24px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t)}
.pg{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:4px 0 12px}.pg i{display:block;height:100%;background:var(--p)}
.pg i.r{background:var(--r)}.pg i.a{background:var(--a)}.pg i.g{background:var(--g)}
.rw{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.r,.no{color:var(--r)}.a{color:var(--a)}.g,.ok{color:var(--g)}
.st{padding:8px 12px;margin:6px 0;background:var(--bg);border-radius:8px;opacity:0;animation:f .4s forwards;animation-delay:var(--d)}@keyframes f{to{opacity:1}}
.li{display:flex;justify-content:space-between;width:100%;padding:12px 0;background:none;border:0;border-top:1px solid var(--b);color:var(--t);font:inherit;text-align:start}.li:disabled{opacity:.4}
.hm{display:grid;gap:3px;direction:ltr;margin:8px 0}.hm i{font-style:normal;font-size:10px;text-align:center;padding:6px 0;border-radius:5px;background:var(--b);color:var(--s)}.hm i.x1{background:var(--r);color:var(--bg)}.hm i.x2{background:var(--a);color:var(--bg)}.hm i.x3{background:var(--g);color:var(--bg)}.hm i.e{background:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--s);font:inherit;font-size:13px}nav button.on{color:var(--p);font-weight:700}
</style></head><body><main id="v"></main><nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],th=n=>n-n%10;
let S;try{S=JSON.parse(localStorage.getItem('mm'))}catch(e){}
S=S||{done:{},tested:{},sk:{},needs:{},T:{},base:{},log:{}};S.it=S.it||{};
const save=()=>{try{localStorage.setItem('mm',JSON.stringify(S))}catch(e){}},td=()=>new Date().toISOString().slice(0,10);
const G={
tab:l=>{const a=R(2,l>1?12:9),b=R(2,l>1?12:9);return{q:`${a} × ${b}`,a:a*b,tg:[a>5&&b>5?'أرقام كبيرة':'سهل'],h:`${a} × ${b} = ${a*b}`}},
comp:l=>{const n=l>1?R(1,99):5*R(1,19);return{q:`100 − ${n}`,a:100-n,tg:[n%10>5?'آحاد كبيرة':'عادي'],h:`كمّل الآحاد لـ10 والعشرات لـ9 = ${100-n}`}},
sq:l=>{const n=R(2,l>1?25:15);return{q:`${n}²`,a:n*n,tg:[n>15?'فوق 15':'لحد 15'],h:`${n} × ${n} = ${n*n}`}},
dbl:l=>{if(Math.random()<.5){const n=R(12,l>1?499:99);return{q:`ضعف ${n}`,a:2*n,tg:['ضعف'],h:`ضعّف كل خانة من الشمال = ${2*n}`}}const n=2*R(6,l>1?250:50);return{q:`نصف ${n}`,a:n/2,tg:['نصف'],h:`نصّف كل خانة من الشمال = ${n/2}`}},
divr:l=>{const d=P([2,3,4,5,6,9,10,11]),n=Math.random()<.5?d*R(12,99):R(100,999),y=n%d==0,r={4:'آخر رقمين يقبلوا 4',6:'يقبل 2 و3 معًا',2:'آخر رقم زوجي',5:'آخر رقم 0 أو 5',10:'آخر رقم 0',3:'مجموع الأرقام يقبل 3',9:'مجموع الأرقام يقبل 9',11:'الفرق بين مجموع الأرقام الفردية والزوجية يقبل 11'}[d];return{q:`هل ${n} تقبل القسمة على ${d}؟ (1 نعم / 0 لا)`,a:y?1:0,tg:['على '+d],h:`${r} ← ${y?'نعم (1)':'لا (0)'}`}},
add2:l=>{const a=R(12,l>1?98:60),b=R(12,98);return{q:`${a} + ${b}`,a:a+b,tg:[a%10+b%10>9?'ترحيل':'بدون ترحيل'],h:`${a} + ${th(b)} = ${a+th(b)} ثم + ${b%10} = ${a+b}`}},
add3:l=>{if(l<2){const a=R(101,899),b=R(11,99);return{q:`${a} + ${b}`,a:a+b,tg:['3 + 2 خانات'],h:`${a} + ${th(b)} = ${a+th(b)} ثم + ${b%10} = ${a+b}`}}const x=R(11,99),y=R(11,99),z=R(11,99);return{q:`${x} + ${y} + ${z}`,a:x+y+z,tg:['سلسلة'],h:`${x} + ${y} = ${x+y} ثم + ${z} = ${x+y+z}`}},
adj:l=>{const b=P([48,49,51,52,38,98,99,198,199,299]),a=R(21,400),r=b<100?Math.round(b/10)*10:Math.round(b/100)*100;return{q:`${a} + ${b}`,a:a+b,tg:['قريب من '+r],h:`${a} + ${r} = ${a+r} ثم ${b>r?'+':'−'} ${Math.abs(b-r)} = ${a+b}`}},
sub2:l=>{let a,b;if(l<2){a=R(30,99);b=R(11,a-5)}else{a=R(100,999);b=R(11,99)}return{q:`${a} − ${b}`,a:a-b,tg:[b%10>a%10?'استلاف':'عادي'],h:`${a} − ${th(b)} = ${a-th(b)} ثم − ${b%10} = ${a-b}`}},
subc:l=>{const k=R(3,9)*100,d=R(3,19),b=k-d,a=R(k+20,k+600);return{q:`${a} − ${b}`,a:a-b,tg:['قريب من '+k],h:`${a} − ${k} = ${a-k} ثم + ${d} = ${a-b}`}},
dv:l=>{const d=R(2,9),n=d*R(12,110);return{q:`${n} ÷ ${d}`,a:n/d,tg:['قسمة'],h:`قسّم من الشمال = ${n/d}`}}};
const K={tab:['جدول الضرب',1,2],comp:['المكمّلات',1,3],sq:['المربعات',1,3],dbl:['التضعيف والتنصيف',1,3],divr:['قواعد القسمة',1,5],add2:['جمع رقمين',2,3],add3:['جمع 3 أرقام وسلاسل',2,5],adj:['التعويض: قرّب وعدّل',2,4],sub2:['الطرح من الشمال',2,5],subc:['الطرح بالتحويل لجمع',2,6],dv:['القسمة',0,5]};
const BM={tab:'tab',sq:'tab',dbl:'tab',comp:'add2',divr:'dv',add2:'add2',add3:'add2',adj:'add2',sub2:'sub2',subc:'sub2'};
const STG=['الانطلاق','الأساسيات','الجمع والطرح من الشمال'];
const L=[
{id:'intro',s:0,t:'إزاي التطبيق بيشتغل',c:[['e','الفكرة','الحساب الذهني سرعة مبنية على طرق صح وحقائق محفوظة. هنحسب من الشمال لليمين لأننا بنقرأ وننطق الأرقام كده، وده بيخلّي الحساب في الدماغ أسهل.'],['e','إزاي بنتعلم','كل درس كروت: شرح ثم مثال ثم أسئلة. بعد كل مرحلة اختبار بسكور لكل تقنية، والتقنية الضعيفة بتروح قسم الاحتياجات لحد ما تنجح في امتحانها. حل كل مسألة من دماغك بدون ورقة.']]},
{id:'tab',c:[['e','الهدف: إجابة فورية','عايزين الإجابة تطلع من غير ما تحسب، في أقل من ثانيتين. في النص الأول هتحفظ، وفي الباقي هتبني الإجابة بطرق سريعة. أي رقم بتتردد فيه معناه إنه محتاج تدريب.'],['e','الجدول أصغر مما تتخيل','5 × 7 هو نفسه 7 × 5. فبدل 121 حقيقة (من 2 لـ12) عندك 66 بس تتعلمهم. أي ضرب قلبه لو ده بيسهّل عليك.'],['e','×2 و×4 و×8: تضعيف','×2 تضعيف. ×4 تضعيفتين ورا بعض. ×8 تلات تضعيفات. مش هتحتاج تحفظهم.'],['x','مثال: 7 × 8','7 ضعّفه = 14|14 ضعّفه = 28 (ده ×4)|28 ضعّفه = 56 (ده ×8)'],['e','×5: نصف ×10','اضرب في 10 وبعدين نصّف.'],['x','مثال: 12 × 5 و 7 × 5','12 × 10 = 120 ← نصفه 60|7 × 10 = 70 ← نصفه 35'],['e','×9: عشرة ناقص واحد','×9 = ×10 ناقص الرقم نفسه. وناتج ×9 مجموع أرقامه دايمًا 9 (72 ← 7+2=9)، تتأكد بيه من إجابتك.'],['x','مثال: 8 × 9','8 × 10 = 80|80 − 8 = 72|7 + 2 = 9 ✓'],['q','7 × 9','63','7 × 10 = 70 ثم − 7 = 63'],['e','×11 و×12','×11 لحد 9: كرر الرقم (11 × 7 = 77). ×12 = ×10 + ×2. و11 × 12 = 110 + 22 = 132.'],['x','مثال: 12 × 7','10 × 7 = 70|2 × 7 = 14|70 + 14 = 84'],['e','×3 و×6','×3 = ×2 + الرقم نفسه. ×6 = ×5 + الرقم نفسه، وده أسهل من الحفظ.'],['x','مثال: 6 × 8 و 3 × 7','6 × 8 = 5 × 8 + 8 = 40 + 8 = 48|3 × 7 = 14 + 7 = 21'],['q','6 × 7','42','5 × 7 = 35 ثم + 7 = 42'],['e','الصعاب الحقيقية','الصعب فعلًا: 6×7 و6×8 و7×8 و7×9 و8×9. الحيلة: حوّلها لمربع قريب. 7 × 8 = 7² + 7 = 56. و6 × 8 = 7² − 1 = 48 (لأن 6 و8 حوالين 7).'],['x','مثال: 7 × 9 بالمربع','7 و9 حوالين 8|8² = 64|64 − 1 = 63'],['q','7 × 8','56','7² = 49 ثم + 7 = 56'],['e','إزاي تتدرب صح','جاوب من دماغك قبل ما تتأكد. لو غلطت في حقيقة، ارجعلها بعد دقيقة وبعدين تاني يوم. التطبيق هيكرّر الضعيف أكتر، وده أقوى من إعادة الجدول كله.']]},
{id:'comp',c:[['e','يعني إيه مكمّل؟','المكمّل هو الناقص عشان توصل لرقم مدوّر. مكمّل 7 لـ10 هو 3، ومكمّل 37 لـ100 هو 63. بيفيدك في الطرح والباقي والنسب.'],['e','مكمّل 10: الأساس','لازم تعرفه فورًا: 1↔9، 2↔8، 3↔7، 4↔6، 5↔5. كل مكمّلات 100 مبنية عليه.'],['e','مكمّل 100: قاعدة 9 و10','كمّل العشرات لحد 9 والآحاد لحد 10. بتتنفذ في ثانية.'],['x','مثال: 100 − 37','العشرات: 3 ← 6 (لحد 9)|الآحاد: 7 ← 3 (لحد 10)|الناتج 63'],['x','مثال: 100 − 68','العشرات: 6 ← 3|الآحاد: 8 ← 2|الناتج 32'],['e','حالة خاصة: آخره صفر','لو الآحاد 0 كمّل العشرات لـ10 بس: 100 − 40 = 60.'],['q','100 − 74','26','7 ← 2 و 4 ← 6 فالناتج 26'],['e','مكمّل 1000','نفس الفكرة: المئات والعشرات لحد 9، والآحاد لحد 10.'],['x','مثال: 1000 − 347','المئات: 3 ← 6|العشرات: 4 ← 5|الآحاد: 7 ← 3|الناتج 653'],['q','1000 − 482','518','4 ← 5 و 8 ← 1 و 2 ← 8 فالناتج 518'],['e','الطرح من 200 و300','قسّمها: ميّة + مكمّل. بتختصر طرح صعب في خطوتين.'],['x','مثال: 200 − 68','200 − 68 = 100 + (100 − 68)|= 100 + 32|= 132'],['q','200 − 85','115','100 + (100 − 85) = 115'],['e','في الفلوس','معاك 100 جنيه وصرفت 37؟ الباقي مكمّل 37 = 63. نفس الفكرة مع أي ورقة 100 أو 200.']]},
{id:'sq',c:[['e','ليه المربعات؟','المربع بيظهر في فرق المربعات والتربيع وتقدير الجذور. لو حفظتها هتوفّر وقت كبير في المراحل الجاية.'],['e','من 1 لـ10','1، 4، 9، 16، 25، 36، 49، 64، 81، 100. دول من الجدول عندك.'],['e','من 11 لـ15','11² = 121، 12² = 144، 13² = 169، 14² = 196، 15² = 225.'],['e','قاعدة القفزة الفردية','n² = (n − 1)² + (2n − 1). يعني من مربع تعرفه تطلع للي جنبه. الفروق: 121 ← 144 (+23) ← 169 (+25) ← 196 (+27).'],['x','مثال: 14² من 13²','13² = 169|2 × 14 − 1 = 27|169 + 27 = 196'],['e','من 16 لـ20','16² = 256، 17² = 289، 18² = 324، 19² = 361، 20² = 400.'],['e','من 21 لـ25','21² = 441، 22² = 484، 23² = 529، 24² = 576، 25² = 625.'],['e','حيلة: قرّب لرقم مدوّر','n² = (n − a)(n + a) + a². اختار a اللي يوصّلك لعشرة.'],['x','مثال: 17²','a = 3|14 × 20 = 280|280 + 3² = 289'],['x','مثال: 23²','a = 3|20 × 26 = 520|520 + 9 = 529'],['q','18²','324','16 × 20 = 320 ثم + 2² = 324'],['e','فحص سريع للإجابة','المربع بيخلص دايمًا بـ0 أو 1 أو 4 أو 5 أو 6 أو 9. لو طلع آخره 2 أو 3 أو 7 أو 8 يبقى فيه غلط.'],['q','24²','576','20 × 28 = 560 ثم + 4² = 576']]},
{id:'dbl',c:[['e','ليه التضعيف والتنصيف؟','بيبسّطوا الضرب والقسمة: ×4 و×8 و×5 و×25 و÷4. وبتحتاجهم في كل المراحل الجاية.'],['e','التضعيف خانة خانة','ضعّف من الشمال: المئات ثم العشرات ثم الآحاد، وجمّعهم بالتدريج.'],['x','مثال: ضعف 68','60 × 2 = 120|8 × 2 = 16|120 + 16 = 136'],['x','مثال: ضعف 387','300 × 2 = 600|80 × 2 = 160 ← 760|7 × 2 = 14 ← 774'],['q','ضعف 76','152','70 × 2 = 140 ثم 6 × 2 = 12 ← 152'],['e','التنصيف بالتقسيم','قسّم الرقم لأجزاء زوجية وسهلة، ونصّف كل جزء.'],['x','مثال: نصف 374','300 ← 150|70 ← 35 ← 185|4 ← 2 ← 187'],['x','مثال: نصف 138','100 ← 50|38 ← 19 ← 69'],['q','نصف 276','138','200 ← 100 ثم 76 ← 38 ← 138'],['e','×4 و÷4','×4 تضعيفتين، و÷4 تنصيفتين. أسرع من الضرب والقسمة العادية.'],['x','مثال: 35 × 4 و 52 ÷ 4','35 ← 70 ← 140|52 ← 26 ← 13'],['e','×5 و÷5','×5 = ×10 ثم نصف. ÷5 = ×2 ثم ÷10.'],['x','مثال: 46 × 5 و 85 ÷ 5','46 × 10 = 460 ← 230|85 × 2 = 170 ← 17'],['e','×25','×25 = ×100 ثم تنصيفتين. مثال: 36 × 25 = 3600 ← 1800 ← 900.'],['e','حيلة: ضعّف وانصّف','لو ضعّفت رقم ونصّفت التاني، ناتج الضرب ما يتغيّرش. استخدمها لتحويل ضرب صعب لسهل.'],['x','مثال: 35 × 18','نصّف 18 ← 9 وضعّف 35 ← 70|70 × 9 = 630'],['q','ضعف 245','490','200 × 2 = 400 و 45 × 2 = 90 ← 490']]},
{id:'divr',c:[['e','ليه قواعد القسمة؟','بتعرف الرقم بيقبل القسمة على إيه من غير ما تقسم: لتبسيط الكسور، وتقدير القسمة، وفحص إجاباتك.'],['e','2 و5 و10: آخر رقم','2: آخر رقم زوجي. 5: آخر رقم 0 أو 5. 10: آخر رقم 0.'],['e','4: آخر رقمين','الرقم يقبل 4 لو آخر رقمين فيه يقبلوا 4 (لأن 100 بتقبل 4).'],['x','مثال: 1316 و 1322','16 ÷ 4 = 4 ← 1316 تقبل 4|22 مش بتقبل 4 ← 1322 لا'],['e','3 و9: مجموع الأرقام','لو مجموع الأرقام يقبل 3 يبقى الرقم يقبل 3، ولو يقبل 9 يبقى يقبل 9. السبب: 10 و100 و1000 كلهم أكبر من مضاعف 9 بواحد، فالباقي = مجموع الأرقام.'],['x','مثال: 738 و 2451','7 + 3 + 8 = 18 ← تقبل 3 و9|2 + 4 + 5 + 1 = 12 ← تقبل 3 بس'],['q','هل 4527 تقبل القسمة على 9؟ (1 نعم / 0 لا)','1','4 + 5 + 2 + 7 = 18 ← تقبل 9'],['e','6: يقبل 2 و3 معًا','لو الرقم زوجي ومجموع أرقامه يقبل 3 يبقى يقبل 6.'],['x','مثال: 5124','آخره 4 زوجي ✓|5 + 1 + 2 + 4 = 12 يقبل 3 ✓|يبقى يقبل 6'],['e','11: الفرق بين المجموعين','اجمع الأرقام في الأماكن الفردية والزوجية (من اليمين) واطرح. لو الفرق 0 أو يقبل 11 يبقى الرقم يقبل 11.'],['x','مثال: 7293','7 + 9 = 16|2 + 3 = 5|16 − 5 = 11 ← يقبل 11'],['q','هل 918 تقبل القسمة على 11؟ (1 نعم / 0 لا)','0','9 + 8 = 17 و 1 ← الفرق 16 ← لا'],['e','فحص إجاباتك بطرح التسعات','اجمع أرقام كل رقم لحد ما يبقى رقم واحد (9 يُعتبر 0) واضرب. لازم الناتج يطابق ناتج الإجابة. بيمسك أغلب الأخطاء، بس مش بيثبت إن الإجابة صح.'],['x','مثال: 47 × 36 = 1692','47 ← 11 ← 2|36 ← 9 ← 0|2 × 0 = 0|1692 ← 18 ← 9 ← 0 ✓']]},
{id:'add2',c:[['e','من الشمال','ابدأ بالعشرات: ضيف عشرات الرقم التاني للأول، وبعدين الآحاد. كده بتنطق الناتج بالترتيب الطبيعي وما بتحتفظش بأرقام كتير في دماغك.'],['x','مثال: 47 + 38','47 + 30 = 77|77 + 8 = 85'],['e','ملاحظة','قول الخطوات بصوت واطي وإنت بتتدرب، ده بيسرّع التعلم.']]},
{id:'add3',c:[['e','أرقام أكتر','مع 3 أرقام أو سلسلة جمع، اجمع واحد واحد بنفس الطريقة وانطق الناتج الجزئي كل مرة بدل ما تحفظ الأرقام كلها.'],['x','مثال: 623 + 59','623 + 50 = 673|673 + 9 = 682'],['x','مثال: 47 + 38 + 26','47 + 38 = 85|85 + 26 = 111']]},
{id:'adj',c:[['e','قرّب وعدّل','لو الرقم قريب من رقم مدوّر (49 أو 98 أو 199) اجمع المدوّر وبعدين عدّل الفرق. أسهل بكتير من الجمع الأصلي.'],['x','مثال: 76 + 49','76 + 50 = 126|126 − 1 = 125'],['x','مثال: 138 + 198','138 + 200 = 338|338 − 2 = 336']]},
{id:'sub2',c:[['e','الطرح من الشمال','اطرح العشرات الأول وبعدين الآحاد على التوالي، من غير استلاف على الورق.'],['x','مثال: 832 − 47','832 − 40 = 792|792 − 7 = 785']]},
